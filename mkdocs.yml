site_name: Kea for Mere Mortals
site_description: The DHCP server that hands out your network's addresses, taught from a loopback lab. Writing Kea's JSON configuration and checking it before you trust it, running the server, reserving addresses for known machines, working the lease database, and running the whole thing through its control channel and REST API, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/kea-for-mere-mortals/
